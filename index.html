<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wetik - Mạng xã hội video ngắn</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }

        @keyframes giftFloat {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            30% { transform: translateY(-30px) scale(1.3); opacity: 1; }
            70% { transform: translateY(-70px) scale(1.1); opacity: 1; }
            100% { transform: translateY(-120px) scale(0.8); opacity: 0; }
        }
        .animate-gift-float { animation: giftFloat 2s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 25px rgba(245, 158, 11, 0.8); }
        }
        .glow-amber { animation: pulseGlow 2s infinite; }
    </style>
</head>
<body class="bg-gray-950 flex justify-center items-center h-screen m-0 overflow-hidden font-sans select-none">
    <div id="root" class="w-full h-full flex justify-center items-center"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
            Home, PlusSquare, User, Star, MessageCircle, Share2, ArrowLeft, Camera, Send, 
            Settings, CheckCircle2, Video, Radio, Users, Bell, Shield, LogOut, UserCheck, 
            UserPlus, UserMinus, Globe, Languages, Ban, Check, Sliders, RefreshCw, Upload, 
            Image as ImageIcon, Flag, AlertTriangle, UserPlus2, LogIn, Gift, Coins, Trophy, 
            Sparkles, Heart, Rocket, Flame, Award, CheckCircle, ChevronRight, X, Mic, MicOff, Play, Crown, Repeat
        } = lucide;

        // Danh sách quà tặng
        const GIFT_ITEMS = [
            { id: 'heart', name: 'Tim yêu thương', cost: 1, icon: '❤️', animation: '💖' },
            { id: 'rose', name: 'Hoa hồng', cost: 2, icon: '🌹', animation: '🌹' },
            { id: 'boba', name: 'Trà sữa', cost: 5, icon: '🧋', animation: '🧋' },
            { id: 'car', name: 'Xe mui trần', cost: 10, icon: '🏎️', animation: '🏎️' },
            { id: 'rocket', name: 'Tên lửa VIP', cost: 15, icon: '🚀', animation: '🚀' }
        ];

        function WetikFullApp() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [authView, setAuthView] = useState('login'); 
            const [usernameInput, setUsernameInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [pinInput, setPinInput] = useState('');
            const [authError, setAuthError] = useState('');
            const [authSuccess, setAuthSuccess] = useState('');

            const [registeredUsers, setRegisteredUsers] = useState([
                { username: 'wetik', password: 'wetikhehe@', pin: 'wetikhaykeu', isVerified: true, isAdmin: true, coins: 500 }
            ]);

            const [activeTab, setActiveTab] = useState('feed'); 
            const [uploadMode, setUploadMode] = useState('video'); 

            const [shareModalVideo, setShareModalVideo] = useState(null);
            const [giftModalVideo, setGiftModalVideo] = useState(null);
            const [activeGiftAnim, setActiveGiftAnim] = useState(null);
            const [showMissionsModal, setShowMissionsModal] = useState(false);

            const [activeGameRoom, setActiveGameRoom] = useState(null); 
            const [isMicOn, setIsMicOn] = useState(false);
            const [werewolfPlayers, setWerewolfPlayers] = useState([
                { id: 1, name: 'Ngài Ruka (Bạn)', role: 'Tiên Tri 🔮', isAlive: true, isTalking: false },
                { id: 2, name: 'Coder Pro', role: 'Dân Làng 🧑', isAlive: true, isTalking: false },
                { id: 3, name: 'FF King', role: 'Sói Đêm 🐺', isAlive: false, isTalking: false },
                { id: 4, name: 'Wetik Bot', role: 'Bảo Vệ 🛡️', isAlive: true, isTalking: true }
            ]);

            const [currentUser, setCurrentUser] = useState({
                id: 1,
                username: '',
                handle: '',
                bio: 'Thành viên sáng tạo trên Wetik 🚀',
                avatar: 'https://i.pravatar.cc/150?img=33',
                banner: 'https://picsum.photos/600/200',
                followersCount: 120,
                followingCount: 5,
                coins: 15,
                isVerified: false,
                isAdmin: false
            });

            const [dailyMissions, setDailyMissions] = useState([
                { id: 1, title: 'Xem 3 video ngắn', reward: 5, target: 3, current: 0, claimed: false, icon: '📺' },
                { id: 2, title: 'Tặng 1 món quà cho thần tượng', reward: 2, target: 1, current: 0, claimed: false, icon: '🎁' },
                { id: 3, title: 'Đăng 1 bình luận tích cực', reward: 1, target: 1, current: 0, claimed: false, icon: '💬' }
            ]);

            const [watchedVideoIds, setWatchedVideoIds] = useState(new Set());

            const [videos, setVideos] = useState([
                {
                    id: 1,
                    authorName: 'wetik',
                    authorHandle: '@wetik_official',
                    authorAvatar: 'https://i.pravatar.cc/150?img=33',
                    isVerified: true,
                    title: 'Chào mừng ngài Ruka đến với phòng game Wetik! ✨ #wetik #gaming',
                    videoUrl: 'https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-woman-skating-41315-large.mp4',
                    starsCount: 1250,
                    giftsReceivedCount: 14,
                    sharesCount: 45,
                    comments: [{ id: 1, authorName: 'ruka_fan', content: 'Ứng dụng mượt quá ngài Ruka ơi!' }]
                }
            ]);

            const [currentVideoIndex, setCurrentVideoIndex] = useState(0);

            const [friends, setFriends] = useState([
                { id: 2, name: 'Coder Pro', handle: '@coder_pro', avatar: 'https://i.pravatar.cc/150?img=12', isVerified: true, isFollowing: true, lastMessage: 'Đã check code backend nhé.', time: 'Hôm qua', online: false },
                { id: 3, name: 'Free Fire Gamer', handle: '@ff_king', avatar: 'https://i.pravatar.cc/150?img=45', isVerified: false, isFollowing: false, lastMessage: 'Làm trận solo không bạn?', time: 'Thứ Hai', online: true }
            ]);
            const [activeChat, setActiveChat] = useState(null);
            const [commentInput, setCommentInput] = useState('');
            const [uploadTitle, setUploadTitle] = useState('');
            const [selectedFileUrl, setSelectedFileUrl] = useState('https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-woman-skating-41315-large.mp4');
            const [starredMap, setStarredMap] = useState({});
            const [activeCommentVideoId, setActiveCommentVideoId] = useState(null);

            useEffect(() => {
                if (isLoggedIn && activeTab === 'feed' && videos[currentVideoIndex]) {
                    const currentVidId = videos[currentVideoIndex].id;
                    if (!watchedVideoIds.has(currentVidId)) {
                        const updatedWatched = new Set(watchedVideoIds).add(currentVidId);
                        setWatchedVideoIds(updatedWatched);

                        setDailyMissions(prev => prev.map(m => {
                            if (m.id === 1 && m.current < m.target) {
                                return { ...m, current: m.current + 1 };
                            }
                            return m;
                        }));
                    }
                }
            }, [currentVideoIndex, activeTab, isLoggedIn]);

            const handleLogin = (e) => {
                e.preventDefault();
                setAuthError('');
                setAuthSuccess('');
                
                const cleanUser = usernameInput.trim();
                const cleanPass = passwordInput.trim();
                const cleanPin = pinInput.trim();

                const foundUser = registeredUsers.find(u => u.username === cleanUser && u.password === cleanPass && u.pin === cleanPin);

                if (foundUser) {
                    setIsLoggedIn(true);
                    setCurrentUser({
                        id: Date.now(),
                        username: foundUser.username,
                        handle: '@' + foundUser.username.toLowerCase(),
                        bio: foundUser.isAdmin ? 'Quản trị viên tối cao ngài Ruka trên Wetik 🚀' : 'Thành viên sáng tạo trên Wetik',
                        avatar: 'https://i.pravatar.cc/150?img=33',
                        banner: 'https://picsum.photos/600/200',
                        followersCount: foundUser.isAdmin ? 1540 : 12,
                        followingCount: 5,
                        coins: foundUser.coins || 15,
                        isVerified: foundUser.isVerified,
                        isAdmin: foundUser.isAdmin
                    });
                } else {
                    setAuthError('Sai tên tài khoản, mật khẩu hoặc mã bảo mật!');
                }
            };

            const handleRegister = (e) => {
                e.preventDefault();
                setAuthError('');
                setAuthSuccess('');

                const cleanUser = usernameInput.trim();
                const cleanPass = passwordInput.trim();
                const cleanPin = pinInput.trim();

                if (!cleanUser || !cleanPass || !cleanPin) {
                    setAuthError('Vui lòng nhập đầy đủ thông tin đăng ký!');
                    return;
                }

                const existing = registeredUsers.find(u => u.username === cleanUser);
                if (existing) {
                    setAuthError('Tên tài khoản này đã được sử dụng!');
                    return;
                }

                const newUserObj = { username: cleanUser, password: cleanPass, pin: cleanPin, isVerified: false, isAdmin: false, coins: 15 };
                setRegisteredUsers([...registeredUsers, newUserObj]);
                setAuthSuccess('Đăng ký thành công! Nhận ngay 15 Coins 🎉');
                setUsernameInput('');
                setPasswordInput('');
                setPinInput('');
                setTimeout(() => setAuthView('login'), 1200);
            };

            const handleSendGift = (gift) => {
                if (currentUser.coins < gift.cost) {
                    alert(`Bạn cần ${gift.cost} Coins để tặng "${gift.name}".`);
                    return;
                }
                setCurrentUser(prev => ({ ...prev, coins: prev.coins - gift.cost }));
                setVideos(videos.map(v => v.id === giftModalVideo.id ? { 
                    ...v, 
                    giftsReceivedCount: (v.giftsReceivedCount || 0) + 1,
                    starsCount: v.starsCount + gift.cost * 10 
                } : v));
                setActiveGiftAnim({ icon: gift.animation, id: Date.now() });
                setTimeout(() => setActiveGiftAnim(null), 2000);
                setGiftModalVideo(null);
            };

            const handleClaimReward = (missionId) => {
                const mission = dailyMissions.find(m => m.id === missionId);
                if (!mission || mission.claimed || mission.current < mission.target) return;
                setCurrentUser(prev => ({ ...prev, coins: prev.coins + mission.reward }));
                setDailyMissions(dailyMissions.map(m => m.id === missionId ? { ...m, claimed: true } : m));
            };

            const handleRepostVideo = (video) => {
                const repostedItem = {
                    id: Date.now(),
                    authorName: currentUser.username,
                    authorHandle: currentUser.handle,
                    authorAvatar: currentUser.avatar,
                    isVerified: currentUser.isVerified,
                    title: `🔁 Đăng lại từ ${video.authorName}: ${video.title}`,
                    videoUrl: video.videoUrl,
                    starsCount: 0,
                    giftsReceivedCount: 0,
                    sharesCount: 0,
                    comments: []
                };
                setVideos([repostedItem, ...videos]);
                setShareModalVideo(null);
                alert('Đã đăng lại video lên trang cá nhân thành công! 🚀');
            };

            const toggleStar = (videoId) => {
                setStarredMap(prev => {
                    const isStarred = !prev[videoId];
                    setVideos(videos.map(v => v.id === videoId ? { ...v, starsCount: v.starsCount + (isStarred ? 1 : -1) } : v));
                    return { ...prev, [videoId]: isStarred };
                });
            };

            if (!isLoggedIn) {
                return (
                    <div className="flex justify-center items-center h-screen bg-gray-950 text-white font-sans w-full">
                        <div className="w-[390px] h-[800px] bg-black rounded-[40px] p-6 flex flex-col justify-between border-[6px] border-gray-800 shadow-2xl overflow-y-auto">
                            <div className="text-center pt-8">
                                <div className="w-16 h-16 bg-gradient-to-tr from-amber-600 to-amber-400 rounded-2xl mx-auto flex items-center justify-center shadow-xl mb-3 border-2 border-amber-300">
                                    <Video className="w-8 h-8 text-black" />
                                </div>
                                <h1 className="text-4xl font-extrabold text-amber-400 tracking-wider">WETIK</h1>
                                <p className="text-xs text-gray-400 mt-2">Mạng xã hội video ngắn & Giải trí</p>
                                
                                <div className="flex bg-gray-900 rounded-full p-1 mt-5 border border-gray-800">
                                    <button onClick={() => { setAuthView('login'); setAuthError(''); setAuthSuccess(''); }} className={`flex-1 py-1.5 rounded-full text-xs font-semibold transition ${authView === 'login' ? 'bg-amber-500 text-black' : 'text-gray-400'}`}>Đăng Nhập</button>
                                    <button onClick={() => { setAuthView('register'); setAuthError(''); setAuthSuccess(''); }} className={`flex-1 py-1.5 rounded-full text-xs font-semibold transition ${authView === 'register' ? 'bg-amber-500 text-black' : 'text-gray-400'}`}>Đăng Ký</button>
                                </div>
                            </div>

                            {authView === 'login' ? (
                                <form onSubmit={handleLogin} className="space-y-3.5 my-auto">
                                    {authError && <div className="p-2.5 bg-red-600/20 border border-red-500/50 rounded-xl text-red-400 text-xs text-center font-medium">{authError}</div>}
                                    {authSuccess && <div className="p-2.5 bg-green-600/20 border border-green-500/50 rounded-xl text-green-400 text-xs text-center font-medium">{authSuccess}</div>}
                                    <div>
                                        <label className="text-[11px] text-gray-400 block mb-1 font-medium">Tên tài khoản</label>
                                        <input type="text" value={usernameInput} onChange={(e) => setUsernameInput(e.target.value)} required className="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-500" placeholder="Nhập tên tài khoản..." />
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-gray-400 block mb-1 font-medium">Mật khẩu</label>
                                        <input type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} required className="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-500" placeholder="Nhập mật khẩu..." />
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-gray-400 block mb-1 font-medium">Mã bảo mật</label>
                                        <input type="password" value={pinInput} onChange={(e) => setPinInput(e.target.value)} required className="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-500" placeholder="Nhập mã bảo mật..." />
                                    </div>
                                    <button type="submit" className="w-full py-3.5 bg-amber-500 text-black font-bold rounded-xl text-xs mt-2 hover:bg-amber-400 transition shadow-lg flex items-center justify-center gap-2">
                                        <LogIn className="w-4 h-4"/> Đăng Nhập
                                    </button>
                                </form>
                            ) : (
                                <form onSubmit={handleRegister} className="space-y-3.5 my-auto">
                                    {authError && <div className="p-2.5 bg-red-600/20 border border-red-500/50 rounded-xl text-red-400 text-xs text-center font-medium">{authError}</div>}
                                    {authSuccess && <div className="p-2.5 bg-green-600/20 border border-green-500/50 rounded-xl text-green-400 text-xs text-center font-medium">{authSuccess}</div>}
                                    <div>
                                        <label className="text-[11px] text-gray-400 block mb-1 font-medium">Tên tài khoản mới</label>
                                        <input type="text" value={usernameInput} onChange={(e) => setUsernameInput(e.target.value)} required className="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-500" placeholder="Chọn tên tài khoản..." />
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-gray-400 block mb-1 font-medium">Mật khẩu</label>
                                        <input type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} required className="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-500" placeholder="Tạo mật khẩu..." />
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-gray-400 block mb-1 font-medium">Mã bảo mật (PIN)</label>
                                        <input type="password" value={pinInput} onChange={(e) => setPinInput(e.target.value)} required className="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-500" placeholder="Tạo mã bảo mật..." />
                                    </div>
                                    <button type="submit" className="w-full py-3.5 bg-amber-500 text-black font-bold rounded-xl text-xs mt-2 hover:bg-amber-400 transition shado
